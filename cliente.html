<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregando site...</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #101114; color: white;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 400px; width: 100%; padding: 24px;
      border-radius: 16px; background: #1b1c21; border: 1px solid #33353d;
    }
    img.logo { max-width: 100px; max-height: 100px; border-radius: 12px; margin-bottom: 16px; }
    h1 { margin: 0 0 10px 0; font-size: 22px; }
    p { color: #c4c5cc; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container" id="conteudo">
    <p id="mensagem">A carregar informações do site...</p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://hqoqbjwjjmnhctjizvcs.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_QK2T4-OP6omrbgGmTwbmsw_VKfgeFuk';

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // Obtém o slug da URL (ex: ?slug=site-teste)
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    const mensagem = document.getElementById('mensagem');
    const conteudo = document.getElementById('conteudo');

    async function carregarSitePublico() {
      if (!slug) {
        mensagem.textContent = 'Nenhum site especificado na URL.';
        return;
      }

      const { data, error } = await supabase
        .from('sites')
        .select('name, slug, published, content')
        .eq('slug', slug)
        .single();

      if (error || !data) {
        mensagem.textContent = 'Site não encontrado.';
        return;
      }

      if (!data.published) {
        mensagem.textContent = 'Este site ainda não está publicado.';
        return;
      }

      // Aplica as cores dinâmicas configuradas
      const corPrincipal = data.content?.corPrincipal || '#e8b84a';
      const corFundo = data.content?.corFundo || '#101114';
      const logoUrl = data.content?.logo || '';

      document.body.style.backgroundColor = corFundo;

      document.title = data.name;

      conteudo.innerHTML = `
        ${logoUrl ? `<img src="${logoUrl}" class="logo" alt="Logo">` : ''}
        <h1 style="color: ${corPrincipal}">${data.name}</h1>
        <p>Site publicado com sucesso via JRB Digital!</p>
      `;
    }

    carregarSitePublico();
  </script>
</body>
</html>
