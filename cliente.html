<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carregando site...</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111114;--card:#c9a34a;--primary:#f7f2e8;--text:#151515;--radius:18px;--font:'Montserrat',sans-serif;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--primary);font-family:var(--font);padding:0 18px 42px;transition:background .25s,color .25s}
.page{width:100%;max-width:560px;margin:0 auto;padding-top:42px}
.identity{text-align:center;margin:0 auto 28px}
.logo{display:block;object-fit:contain;width:132px;height:132px;max-width:48vw;margin:0 auto 20px;border-radius:24px}
.mark{font-size:52px;color:var(--card);margin:10px auto 22px}
.business{font-size:clamp(27px,6vw,38px);font-weight:800;line-height:1.12;overflow-wrap:anywhere;letter-spacing:-.7px}
.description{font-size:14px;line-height:1.6;opacity:.72;margin:11px auto 0;max-width:38ch;overflow-wrap:anywhere}
.links{display:grid;gap:13px}
.link{width:100%;min-height:70px;border:1px solid color-mix(in srgb,var(--primary) 14%,transparent);border-radius:var(--radius);background:var(--card);color:var(--text);display:flex;align-items:center;gap:14px;padding:16px 19px;text-decoration:none;font-weight:750;font-size:clamp(14px,3.7vw,17px);box-shadow:0 8px 24px #00000014;overflow-wrap:anywhere;transition:transform .18s,filter .18s,box-shadow .18s}
.link:active{transform:scale(.985)}
.link i:first-child{width:28px;text-align:center;font-size:23px;flex-shrink:0}
.link .label{flex:1;text-align:center}
.link .end{font-size:14px;opacity:.65}
.notice{text-align:center;margin:40px auto;line-height:1.6}
.footer{text-align:center;margin-top:30px;font-size:11px;opacity:.48;letter-spacing:.3px}
/* ELEGANTE: identidade premium, moldura e botões alongados */
body.layout-elegante{background:radial-gradient(ellipse at top, color-mix(in srgb,var(--card) 13%,var(--bg)) 0, var(--bg) 54%)}
body.layout-elegante .page{max-width:510px;padding-top:48px}
body.layout-elegante .identity{padding:0 16px 26px;border-bottom:1px solid color-mix(in srgb,var(--card) 40%,transparent);margin-bottom:25px}
body.layout-elegante .logo{border-radius:50%;padding:7px;border:1px solid color-mix(in srgb,var(--card) 65%,transparent);box-shadow:0 0 0 7px color-mix(in srgb,var(--card) 8%,transparent)}
body.layout-elegante .business{font-family:'Playfair Display',serif;letter-spacing:.2px}
body.layout-elegante .link{min-height:76px;border-radius:9px;box-shadow:0 9px 25px #00000028;letter-spacing:.1px}
body.layout-elegante .link:hover{transform:translateY(-2px);filter:brightness(1.07)}
/* MODERNO: cartões em grade, com ícones e etiquetas */
body.layout-moderno{background:linear-gradient(145deg,color-mix(in srgb,var(--card) 11%,var(--bg)),var(--bg) 58%)}
body.layout-moderno .page{max-width:760px;padding-top:30px}
body.layout-moderno .identity{display:flex;flex-direction:column;align-items:center;margin-bottom:30px}
body.layout-moderno .logo{width:116px;height:116px;border-radius:28px;margin-bottom:16px;box-shadow:0 12px 30px #00000020}
body.layout-moderno .mark{margin:0 auto 16px}
body.layout-moderno .business{font-family:'Poppins',sans-serif;font-size:clamp(26px,5vw,35px);letter-spacing:-1px}
body.layout-moderno .description{padding:8px 16px;border-radius:30px;background:color-mix(in srgb,var(--primary) 7%,transparent)}
body.layout-moderno .links{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
body.layout-moderno .link{min-height:138px;flex-direction:column;justify-content:center;gap:13px;padding:18px 12px;border:0;border-radius:20px;box-shadow:0 12px 28px #00000020}
body.layout-moderno .link i:first-child{width:auto;font-size:30px}
body.layout-moderno .link .label{flex:0;text-align:center;line-height:1.35}
body.layout-moderno .link .end{display:none}
body.layout-moderno .footer{padding-top:18px;border-top:1px solid color-mix(in srgb,var(--primary) 12%,transparent)}
/* MINIMALISTA: leve, claro e com linhas discretas */
body.layout-minimalista{background:var(--bg)}
body.layout-minimalista .page{max-width:500px;padding-top:26px}
body.layout-minimalista .identity{margin-bottom:24px}
body.layout-minimalista .logo{width:92px;height:92px;border-radius:50%;margin-bottom:15px}
body.layout-minimalista .mark{font-size:36px;margin:0 auto 16px}
body.layout-minimalista .business{font-family:'Montserrat',sans-serif;font-size:clamp(23px,5vw,30px);font-weight:700;letter-spacing:-.8px}
body.layout-minimalista .description{font-size:13px}
body.layout-minimalista .links{gap:9px}
body.layout-minimalista .link{min-height:57px;border:1px solid color-mix(in srgb,var(--primary) 23%,transparent);border-radius:7px;box-shadow:none;background:transparent;color:var(--primary);padding:13px 15px;font-size:14px;font-weight:600}
body.layout-minimalista .link i:first-child{font-size:18px}
body.layout-minimalista .link .end{font-size:11px}
body.layout-minimalista .link:hover{background:color-mix(in srgb,var(--primary) 5%,transparent)}
@media(max-width:520px){
 body.layout-moderno .links{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 body.layout-moderno .link{min-height:125px;padding:15px 8px;font-size:13px}
 body.layout-moderno .link i:first-child{font-size:27px}
}
@media(min-width:700px){.page{padding-top:52px}.logo{width:150px;height:150px}.link{min-height:76px;padding:18px 24px}}
@media(prefers-reduced-motion:no-preference){.link:hover{filter:brightness(1.04)}}
</style>
</head>
<body><main class="page" id="app"><p class="notice">Carregando página...</p></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://hqoqbjwjjmnhctjizvcs.supabase.co';
const SUPABASE_KEY='sb_publishable_QK2T4-OP6omrbgGmTwbmsw_VKfgeFuk';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY),app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function fail(msg){app.innerHTML=`<section class="notice"><i class="fa-solid fa-circle-info" style="font-size:34px"></i><h2>${esc(msg)}</h2><p>Confira o endereço ou fale com o responsável pelo site.</p></section>`}
function instagram(v){v=String(v||'').trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;return'https://instagram.com/'+v.replace(/^@/,'')}
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){fail('Página não encontrada.');return}try{
const{data,error}=await supabase.from('sites').select('name,slug,content,published').eq('slug',slug).maybeSingle();
if(error)throw error;if(!data){fail('Página não encontrada.');return}if(!data.published){fail('Este site está temporariamente indisponível.');return}
const c=data.content&&typeof data.content==='object'?data.content:{};
const layout=['elegante','moderno','minimalista'].includes(c.layout)?c.layout:'elegante';
document.body.classList.add('layout-'+layout);
document.documentElement.style.setProperty('--bg',c.bgColor||'#111114');
document.documentElement.style.setProperty('--card',c.cardColor||'#c9a34a');
document.documentElement.style.setProperty('--primary',c.primaryColor||'#f7f2e8');
document.documentElement.style.setProperty('--text',c.textColor||'#151515');
document.documentElement.style.setProperty('--radius',c.btnRadius||'18px');
document.documentElement.style.setProperty('--font',c.font||"'Montserrat',sans-serif");
document.title=data.name||'Links oficiais';
const links=[];const add=(label,icon,url,action='link')=>{if(url)links.push({label,icon,url,action})};
const phone=String(c.whatsapp||'').replace(/\D/g,'');add('Conversar no WhatsApp','fa-brands fa-whatsapp',phone?'https://wa.me/'+phone:'');
add('Siga no Instagram','fa-brands fa-instagram',instagram(c.instagram));add('Avalie no Google','fa-brands fa-google',c.maps);
if(c.pix)add('Chave Pix para Pagamento','fa-solid fa-money-bill-transfer','#pix','pix');
if(c.wifiNome)add('Wi-Fi do Estabelecimento','fa-solid fa-wifi','#wifi','wifi');
const logo=c.logoUrl?`<img class="logo" src="${esc(c.logoUrl)}" alt="Logotipo" onerror="this.style.display='none'">`:`<div class="mark"><i class="fa-solid fa-crown"></i></div>`;
const cards=links.map(x=>`<a class="link" href="${x.action==='pix'||x.action==='wifi'?'#'+x.action:esc(x.url)}" ${x.action==='link'?'target="_blank" rel="noopener noreferrer"':''} data-action="${x.action}"><i class="${x.icon}"></i><span class="label">${esc(x.label)}</span><i class="fa-solid fa-chevron-right end"></i></a>`).join('');
app.innerHTML=`<header class="identity">${logo}<div class="business">${esc(data.name)}</div><div class="description">${esc(c.description||'Links oficiais e atendimento')}</div></header><section class="links">${cards||'<p class="notice">Os links deste site ainda não foram configurados.</p>'}</section><div class="footer">Links oficiais · ${esc(data.name)}</div>`;
app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',async ev=>{if(el.dataset.action==='pix'){ev.preventDefault();try{await navigator.clipboard.writeText(String(c.pix||''));alert('Chave Pix copiada!')}catch{prompt('Copie a chave Pix:',c.pix||'')}}if(el.dataset.action==='wifi'){ev.preventDefault();alert('Rede Wi-Fi: '+(c.wifiNome||'')+'\nSenha: '+(c.wifiSenha||'Não informada'))}}));
}catch(e){console.error(e);fail('Não foi possível carregar esta página. Verifique a conexão e tente novamente.')}}
load();
</script></body></html>
