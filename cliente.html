<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Acesse os canais oficiais deste estabelecimento.">
<title>Carregando site…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{color-scheme:light;--bg:#f4f4f2;--surface:#fff;--card:#171717;--primary:#151515;--text:#fff;--muted:#777;--accent:#c9a65b;--radius:18px;--font:'DM Sans',sans-serif;--border:rgba(20,20,20,.09);--shadow:0 14px 38px rgba(20,20,20,.07)}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;padding:0 18px 30px;background:var(--bg);color:var(--primary);font-family:var(--font);-webkit-font-smoothing:antialiased}button,a{font:inherit}a{color:inherit}.shell{width:100%;max-width:560px;margin:0 auto;padding:clamp(26px,6vh,58px) 0 16px}.profile{text-align:center;padding:8px 12px 26px}.logo-wrap{width:124px;height:124px;margin:0 auto 22px;display:grid;place-items:center;border-radius:28px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}.logo{display:block;width:100%;height:100%;object-fit:contain;padding:8px}.brand-mark{font-size:42px;color:var(--accent)}.eyebrow{margin:0 0 9px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}.business{margin:0;font-family:var(--font);font-size:clamp(25px,6vw,36px);font-weight:700;line-height:1.15;letter-spacing:-.045em;overflow-wrap:anywhere}.tagline{margin:11px auto 0;max-width:420px;font-size:13px;font-weight:400;line-height:1.75;letter-spacing:.035em;opacity:.74;overflow-wrap:anywhere}.divider{width:44px;height:2px;margin:22px auto 0;background:var(--accent);border-radius:10px}.section-label{margin:0 0 12px;padding:0 3px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}.links{display:grid;gap:11px}.link{position:relative;display:flex;align-items:center;gap:15px;min-height:72px;padding:14px 17px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.045);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;overflow:hidden}.link:focus-visible,.action-button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.link:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 12px 24px rgba(0,0,0,.10)}.link-icon{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);font-size:19px}.link-copy{flex:1;min-width:0;text-align:left}.link-title{display:block;font-size:14px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}.link-subtitle{display:block;margin-top:3px;font-size:11px;font-weight:400;opacity:.72;line-height:1.4}.link-arrow{font-size:12px;opacity:.65}.details{display:grid;gap:12px;margin-top:22px}.detail-card{padding:17px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:0 5px 18px rgba(0,0,0,.025)}.detail-heading{display:flex;align-items:center;gap:9px;margin:0 0 11px;font-size:12px;font-weight:700}.detail-heading i{color:var(--accent)}.detail-value{margin:0;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.action-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 13px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--primary);font-size:12px;font-weight:700;cursor:pointer}.action-button:hover{filter:brightness(.97)}.footer{text-align:center;padding:30px 8px 8px;color:var(--muted);font-size:10px;line-height:1.8}.footer strong{display:block;color:var(--primary);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.powered{margin-top:6px;opacity:.65}.state{max-width:440px;margin:12vh auto 0;text-align:center;padding:28px 22px;border:1px solid var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}.state-icon{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 16px;border-radius:17px;background:var(--bg);font-size:21px;color:var(--accent)}.state h1{margin:0 0 8px;font-size:21px}.state p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.toast{position:fixed;left:50%;bottom:20px;z-index:10;transform:translate(-50%,18px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);padding:12px 17px;border-radius:14px;background:#171717;color:#fff;font-size:12px;box-shadow:0 12px 30px #0003;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}.hidden{display:none!important}
@media(min-width:700px){body{padding-left:24px;padding-right:24px}.shell{padding-top:54px}.logo-wrap{width:140px;height:140px}.link{min-height:78px;padding:16px 19px}.link-title{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell" id="app" aria-live="polite">
  <section class="state"><div class="state-icon"><i class="fa-solid fa-circle-notch fa-spin"></i></div><h1>Preparando sua página</h1><p>Estamos carregando as informações. Só um instante…</p></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Mantém a conexão do projeto JRB Digital.
const SUPABASE_URL = 'https://hqoqbjwjjmnhctjizvcs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QK2T4-OP6omrbgGmTwbmsw_VKfgeFuk';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const toast = document.getElementById('toast');
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let toastTimer;
function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2300)}
function showState(title,description,icon='fa-circle-info'){
  app.innerHTML=`<section class="state"><div class="state-icon"><i class="fa-solid ${icon}"></i></div><h1>${esc(title)}</h1><p>${esc(description)}</p></section>`;
}
function validHttpUrl(value){try{const u=new URL(String(value||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function instagramUrl(value){const raw=String(value||'').trim();if(!raw)return '';if(/^https?:\/\//i.test(raw))return validHttpUrl(raw);const user=raw.replace(/^@/,'').replace(/^\/+|\/+$/g,'');return user?'https://www.instagram.com/'+encodeURIComponent(user)+'/':''}
function whatsappUrl(value){const number=String(value||'').replace(/\D/g,'');return number?'https://wa.me/'+number:''}
function safeColor(value,fallback){const v=String(value||'').trim();return /^#[0-9a-f]{3,8}$/i.test(v)||/^(rgb|rgba|hsl|hsla)\(/i.test(v)?v:fallback}
function safeFont(value){const v=String(value||'').trim().toLowerCase();const allowed={'system':'system-ui, sans-serif','system ui':'system-ui, sans-serif','system-ui, sans-serif':'system-ui, sans-serif','dm sans':"'DM Sans', sans-serif","'dm sans', sans-serif":"'DM Sans', sans-serif",'montserrat':"'Montserrat', sans-serif","'montserrat', sans-serif":"'Montserrat', sans-serif",'poppins':"'Poppins', sans-serif","'poppins', sans-serif":"'Poppins', sans-serif",'playfair display':"'Playfair Display', serif","'playfair display', serif":"'Playfair Display', serif",'bebas neue':"'Bebas Neue', sans-serif","'bebas neue', sans-serif":"'Bebas Neue', sans-serif"};return allowed[v]||'DM Sans, sans-serif'}
function setTheme(c){
 document.documentElement.style.setProperty('--bg',safeColor(c.bgColor,'#f4f4f2'));
 document.documentElement.style.setProperty('--card',safeColor(c.cardColor,'#171717'));
 document.documentElement.style.setProperty('--primary',safeColor(c.primaryColor,'#151515'));
 document.documentElement.style.setProperty('--text',safeColor(c.textColor,'#ffffff'));
 const radius=String(c.btnRadius||'18px');document.documentElement.style.setProperty('--radius',/^(0|[0-9]{1,2}px|[0-9]{1,2}rem|[0-9]{1,2}%|999px)$/.test(radius)?radius:'18px');
 document.documentElement.style.setProperty('--font',safeFont(c.font));
}
function addLink(items,{title,subtitle,icon,url,action='external'}){if(url)items.push({title,subtitle,icon,url,action})}
function render(site){
 const c=site.content&&typeof site.content==='object'?site.content:{};
 setTheme(c);document.title=(site.name||'Links oficiais')+' | Links oficiais';
 const description=String(c.tagline||c.headline||c.description||'Acesse nossos canais oficiais e fale com a gente.').trim();
 const logoUrl=validHttpUrl(c.logoUrl||c.logo_url||'');
 const items=[];
 addLink(items,{title:'Conversar no WhatsApp',subtitle:'Atendimento rápido e direto',icon:'fa-brands fa-whatsapp',url:whatsappUrl(c.whatsapp)});
 addLink(items,{title:'Instagram',subtitle:'Veja novidades e acompanhe nosso trabalho',icon:'fa-brands fa-instagram',url:instagramUrl(c.instagram)});
 addLink(items,{title:'Localização e avaliações',subtitle:'Encontre o estabelecimento no Google',icon:'fa-brands fa-google',url:validHttpUrl(c.maps||c.googleMaps||c.google)});
 addLink(items,{title:'Chave Pix',subtitle:'Copie a chave para realizar um pagamento',icon:'fa-solid fa-money-bill-transfer',url:c.pix?'#pix':'',action:'pix'});
 addLink(items,{title:'Wi-Fi do estabelecimento',subtitle:'Consulte os dados da rede',icon:'fa-solid fa-wifi',url:c.wifiNome?'#wifi':'',action:'wifi'});
 const cards=items.map(item=>{
   const internal=item.action==='pix'||item.action==='wifi';
   const href=internal?'#'+item.action:item.url;
   return `<a class="link" href="${esc(href)}" ${internal?'': 'target="_blank" rel="noopener noreferrer"'} data-action="${esc(item.action)}"><span class="link-icon"><i class="${esc(item.icon)}" aria-hidden="true"></i></span><span class="link-copy"><span class="link-title">${esc(item.title)}</span><span class="link-subtitle">${esc(item.subtitle)}</span></span><i class="fa-solid fa-arrow-up-right-from-square link-arrow" aria-hidden="true"></i></a>`;
 }).join('');
 const logo=logoUrl?`<img class="logo" src="${esc(logoUrl)}" alt="Logo de ${esc(site.name||'estabelecimento')}" onerror="this.closest('.logo-wrap').classList.add('logo-failed');this.remove()">`:`<span class="brand-mark"><i class="fa-solid fa-star"></i></span>`;
 const pix=String(c.pix||'').trim();const wifiName=String(c.wifiNome||'').trim();const wifiPass=String(c.wifiSenha||'').trim();
 const details=[];
 if(pix)details.push(`<section class="detail-card" id="pix"><h2 class="detail-heading"><i class="fa-solid fa-money-bill-transfer"></i> Pagamento via Pix</h2><p class="detail-value">${esc(pix)}</p><div class="detail-actions"><button class="action-button" type="button" data-copy="pix"><i class="fa-regular fa-copy"></i> Copiar chave Pix</button></div></section>`);
 if(wifiName)details.push(`<section class="detail-card" id="wifi"><h2 class="detail-heading"><i class="fa-solid fa-wifi"></i> Wi-Fi para clientes</h2><p class="detail-value"><strong>Rede:</strong> ${esc(wifiName)}<br><strong>Senha:</strong> ${esc(wifiPass||'Consulte a equipe')}</p><div class="detail-actions"><button class="action-button" type="button" data-copy="wifi-name"><i class="fa-regular fa-copy"></i> Copiar nome</button>${wifiPass?'<button class="action-button" type="button" data-copy="wifi-pass"><i class="fa-regular fa-copy"></i> Copiar senha</button>':''}</div></section>`);
 app.innerHTML=`<header class="profile"><div class="logo-wrap">${logo}</div><p class="eyebrow">Bem-vindo(a)</p><h1 class="business">${esc(site.name||'Nosso estabelecimento')}</h1><p class="tagline">${esc(description)}</p><div class="divider"></div></header><section aria-label="Links oficiais"><h2 class="section-label">Conecte-se com a gente</h2><div class="links">${cards||'<p class="detail-value">Os canais deste estabelecimento ainda estão sendo configurados.</p>'}</div></section>${details.length?`<section class="details" aria-label="Informações úteis">${details.join('')}</section>`:''}<footer class="footer"><strong>${esc(site.name||'')}</strong><span>Informações oficiais do estabelecimento</span><div class="powered">Página criada com JRB Digital</div></footer>`;
 app.querySelectorAll('[data-action="pix"],[data-action="wifi"]').forEach(el=>el.addEventListener('click',event=>{event.preventDefault();const target=document.getElementById(el.dataset.action);if(target)target.scrollIntoView({behavior:'smooth',block:'center'})}));
 app.querySelectorAll('[data-copy]').forEach(button=>button.addEventListener('click',async()=>{
   const type=button.dataset.copy;const value=type==='pix'?pix:type==='wifi-name'?wifiName:wifiPass;if(!value)return;
   try{await navigator.clipboard.writeText(value);notify(type==='pix'?'Chave Pix copiada!':type==='wifi-name'?'Nome da rede copiado!':'Senha do Wi-Fi copiada!')}
   catch{const field=document.createElement('textarea');field.value=value;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();notify(ok?'Informação copiada!':'Não foi possível copiar. Selecione e copie o texto manualmente.')}
 }));
}
async function load(){
 const slug=new URLSearchParams(location.search).get('slug');
 if(!slug){showState('Página não encontrada','Este endereço não informa qual site deve ser exibido. Confira o link recebido.');return}
 try{
   const {data,error}=await supabase.from('public_sites').select('name,slug,content,published').eq('slug',slug).maybeSingle();
   if(error)throw error;
   if(!data){showState('Página não encontrada','Não encontramos um site com este endereço. Confira se o link está correto.');return}
   if(!data.published){showState('Página temporariamente indisponível','O responsável por este site ainda não o publicou ou o deixou temporariamente inativo.');return}
   render(data);
 }catch(error){console.error('Falha ao carregar site público:',error);showState('Não foi possível carregar o site','Verifique sua conexão e tente novamente. Se o problema continuar, fale com o responsável pelo site.','fa-triangle-exclamation')}
}
load();
</script>
</body>
</html>
