<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Império Barber Shop | Links oficiais</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--white:#f8f8f8;--black:#050505;--pill:linear-gradient(100deg,#050505 0%,#292929 34%,#f5f5f5 100%)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:#050505}
body{min-height:100vh;color:var(--white);font-family:Montserrat,Arial,sans-serif;overflow-x:hidden;position:relative;background:#050505}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(0,0,0,.20),rgba(0,0,0,.28)),url('./fundo-barbearia.jpg') center center/cover no-repeat;transform:scale(1.03)}
body:after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.13);pointer-events:none}
.page{width:min(100%,540px);min-height:100vh;margin:auto;padding:22px 8.8% 28px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{width:100%;display:flex;flex-direction:column;align-items:center;animation:brandIn 1.25s cubic-bezier(.2,.8,.2,1) both}
.logo{display:block;width:min(100%,390px);height:auto;object-fit:contain;filter:drop-shadow(0 4px 9px #000);animation:logoPulse 1.5s .15s both}
.slogan{font-size:clamp(17px,4.7vw,26px);line-height:1.2;font-weight:800;letter-spacing:-.6px;text-shadow:0 2px 5px #000;margin-top:-2px;white-space:nowrap;animation:rise .8s .65s both}
.rule{width:100%;height:5px;background:#f8f8f8;border-radius:4px;margin-top:7px;position:relative;box-shadow:0 1px 5px #000;animation:lineIn .7s .85s both;transform-origin:center}
.rule:before,.rule:after{content:"";position:absolute;width:5px;height:17px;background:#f8f8f8;top:50%;transform:translateY(-50%);border-radius:2px}.rule:before{left:0}.rule:after{right:0}
.socials{width:100%;display:flex;align-items:center;justify-content:space-around;margin:27px 0 24px;animation:rise .75s 1s both}
.socials a{color:#f7f7f7;font-size:clamp(42px,11vw,58px);line-height:1;text-decoration:none;filter:drop-shadow(0 2px 4px #000);transition:transform .22s ease,color .22s ease}
.socials a:active{transform:scale(.88)}
.links{width:100%;display:flex;flex-direction:column;gap:15px}
.link{position:relative;display:flex;align-items:center;justify-content:center;min-height:55px;padding:10px 16px;border:0;border-radius:999px;background:var(--pill);color:#fff;text-decoration:none;font-size:clamp(16px,4.3vw,22px);font-weight:800;letter-spacing:-.45px;text-shadow:0 1px 2px rgba(0,0,0,.15);box-shadow:0 4px 12px rgba(0,0,0,.26);overflow:hidden;isolation:isolate;opacity:0;transform:translateY(23px) scale(.97);animation:buttonIn .65s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .2s ease,filter .2s ease}
.link:nth-child(1){animation-delay:1.18s}.link:nth-child(2){animation-delay:1.34s}.link:nth-child(3){animation-delay:1.50s}.link:nth-child(4){animation-delay:1.66s}.link:nth-child(5){animation-delay:1.82s}.link:nth-child(6){animation-delay:1.98s}
.link i{position:absolute;left:50%;transform:translateX(-50%);font-size:1.2em;font-weight:400;transition:left .25s ease,transform .25s ease}
.link span{transition:transform .25s ease}
.link:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.23) 45%,transparent 70%);transform:translateX(-130%);transition:transform .65s ease;z-index:-1}
.link:hover:before{transform:translateX(130%)}.link:hover{filter:brightness(1.08)}.link:active{transform:scale(.97)}
.link:focus-visible,.socials a:focus-visible{outline:3px solid white;outline-offset:4px}
.footer{margin-top:auto;padding-top:40px;font-size:11px;letter-spacing:2px;color:#ddd;opacity:.8}
@keyframes brandIn{0%{opacity:0;filter:blur(8px)}100%{opacity:1;filter:blur(0)}}
@keyframes logoPulse{0%{opacity:0;transform:scale(.25) rotateY(75deg);filter:drop-shadow(0 0 22px #fff) blur(3px)}55%{opacity:1;transform:scale(1.04) rotateY(-5deg);filter:drop-shadow(0 0 8px #fff) blur(0)}100%{transform:scale(1);filter:drop-shadow(0 4px 9px #000)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes lineIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes buttonIn{to{opacity:1;transform:translateY(0) scale(1)}}
@media(min-width:600px){.page{padding-top:30px;padding-bottom:35px}.logo{width:390px}.slogan{font-size:25px}.links{gap:17px}.link{min-height:60px;font-size:21px}.socials{margin-top:28px;margin-bottom:28px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="page">
  <header class="brand">
    <img class="logo" src="./logo-imperio.png" alt="Império Barber Shop">
    <p class="slogan">Sua melhor versão começa aqui!!</p>
    <div class="rule" aria-hidden="true"></div>
  </header>
  <nav class="socials" aria-label="Redes sociais">

    <a href="https://www.instagram.com/imperio_barbershop10/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
    <a href="https://search.google.com/local/writereview?placeid=ChIJm3xCfaiR9gcRKegAm2XkBEI" target="_blank" rel="noopener noreferrer" aria-label="Avaliação do Google"><i class="fa-solid fa-globe"></i></a>
  </nav>
  <section class="links" aria-label="Links oficiais">

    <a class="link" href="https://www.instagram.com/imperio_barbershop10/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i><span>Instagram</span></a>
    <a class="link" href="https://search.google.com/local/writereview?placeid=ChIJm3xCfaiR9gcRKegAm2XkBEI" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-globe"></i><span>Avaliação do Google</span></a>
    <a class="link" href="https://www.google.com/maps/search/?api=1&query=Imp%C3%A9rio+Barber+Shop" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-location-dot"></i><span>Localização</span></a>
    <a class="link" href="./wifi.html" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-wifi"></i><span>Wi-Fi Grátis</span></a>
    <a class="link" href="./pix.html" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-diamond"></i><span>Chave pix</span></a>
  </section>
  <footer class="footer">IMPÉRIO BARBER SHOP</footer>
</main>
</body>
</html>
