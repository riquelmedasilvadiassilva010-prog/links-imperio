<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Barber Shop - Links</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Container Principal */
        .card {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 24px;
            padding: 40px 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
        }

        /* Avatar / Logo */
        .profile-img-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            padding: 3px;
            margin: 0 auto 16px;
            background: #101010;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img-wrapper i {
            font-size: 40px;
            color: #d4af37;
        }

        /* Títulos */
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 13px;
            color: #d4af37;
            font-weight: 600;
            margin-bottom: 32px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Lista de Links */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background: #222222;
            border: 1px solid #333333;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn i {
            font-size: 18px;
            color: #d4af37;
        }

        .btn:hover {
            border-color: #d4af37;
            background: #2a2a2a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.15);
        }

        /* Notificação Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #d4af37;
            color: #000000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 200;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Modal do PIX */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: #1c1c1c;
            border: 1px solid #d4af37;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 18px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
        }

        .modal-title {
            color: #d4af37;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .input-group {
            margin: 20px 0 15px 0;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background: #101010;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .input-group input:focus {
            border-color: #d4af37;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        .qr-section {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #333;
        }

        .qr-image {
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            margin: 15px 0;
            width: 180px;
            height: 180px;
        }

        .copy-box {
            background: #101010;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            color: #888;
            word-break: break-all;
            margin-bottom: 10px;
            max-height: 50px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img-wrapper">
            <i class="fa-solid fa-scissors"></i>
        </div>

        <h1>Império Barber Shop</h1>
        <p class="subtitle">Elegância e Tradição</p>

        <div class="links-container">
            <!-- Botão do PIX -->
            <button class="btn" onclick="openPixModal()">
                <i class="fa-brands fa-pix"></i>
                Chave PIX
            </button>

            <!-- Botão Wi-Fi -->
            <button class="btn" onclick="copyWifi()">
                <i class="fa-solid fa-wifi"></i>
                Senha do Wi-Fi
            </button>

            <!-- Agendamento WhatsApp -->
            <a href="https://wa.me/5598984873070?text=Olá,%20gostaria%20de%20agendar%20um%20horário!" target="_blank" class="btn">
                <i class="fa-brands fa-whatsapp"></i>
                Agendar Horário
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com" target="_blank" class="btn">
                <i class="fa-brands fa-instagram"></i>
                Siga no Instagram
            </a>
        </div>
    </div>

    <!-- Toast de Confirmação -->
    <div id="toast" class="toast">Copiado com sucesso!</div>

    <!-- Modal do PIX -->
    <div class="modal-overlay" id="pixModal">
        <div class="modal-card">
            <button class="close-btn" onclick="closePixModal()">&times;</button>
            <div class="modal-title"><i class="fa-brands fa-pix" style="color: #20c997;"></i> Pagamento PIX</div>
            <p style="font-size: 12px; color: #aaa;">Digite o valor do serviço para gerar o QR Code de pagamento.</p>

            <div class="input-group">
                <label for="pixValue">Valor a pagar (R$):</label>
                <input type="number" id="pixValue" placeholder="0.00" step="0.01" min="0.01">
            </div>

            <button class="btn-action" onclick="generatePix()">Gerar QR Code PIX</button>

            <!-- Resultado do QR Code -->
            <div class="qr-section" id="qrSection">
                <p style="font-size: 13px; color: #fff; font-weight: 600;">Escaneie o QR Code abaixo:</p>
                <img id="qrImg" class="qr-image" src="" alt="QR Code PIX">
                <div class="copy-box" id="pixPayloadText">---</div>
                <button class="btn-action" style="background: #222; color: #fff; border: 1px solid #d4af37;" onclick="copyPixCode()">
                    <i class="fa-regular fa-copy"></i> Copiar PIX Copia e Cola
                </button>
            </div>
        </div>
    </div>

    <script>
        const wifiPass = "imperio2024";
        const PIX_KEY = "98984873070";
        const PIX_NAME = "Riquelme da silva dias";
        const PIX_CITY = "SAO LUIS";

        let currentPayload = "";

        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.innerText = text;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        function copyWifi() {
            navigator.clipboard.writeText(wifiPass).then(() => {
                showToast("Senha do Wi-Fi copiada!");
            });
        }

        function openPixModal() {
            document.getElementById('pixModal').style.display = 'flex';
        }

        function closePixModal() {
            document.getElementById('pixModal').style.display = 'none';
            document.getElementById('qrSection').style.display = 'none';
            document.getElementById('pixValue').value = '';
        }

        function generatePix() {
            const rawVal = document.getElementById('pixValue').value;
            const val = parseFloat(rawVal);

            if (!val || val <= 0) {
                alert("Por favor, digite um valor válido (ex: 35.00)");
                return;
            }

            const formattedVal = val.toFixed(2);
            currentPayload = createPixPayload(PIX_KEY, PIX_NAME, PIX_CITY, formattedVal);

            // Gerar imagem do QR Code usando API ultra rápida e confiável
            const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(currentPayload);
            document.getElementById("qrImg").src = qrUrl;

            document.getElementById("pixPayloadText").innerText = currentPayload;
            document.getElementById("qrSection").style.display = "block";
        }

        function copyPixCode() {
            if (!currentPayload) return;
            navigator.clipboard.writeText(currentPayload).then(() => {
                showToast("PIX Copia e Cola copiado!");
            });
        }

        function createPixPayload(key, name, city, value) {
            function formatField(id, val) {
                const len = val.length.toString().padStart(2, '0');
                return `${id}${len}${val}`;
            }

            const cleanKey = key.replace(/\D/g, '');
            const cleanName = name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").substring(0, 25).toUpperCase();
            const cleanCity = city.normalize("NFD").replace(/[\u0300-\u036f]/g, "").substring(0, 15).toUpperCase();

            const merchantAccount = formatField('00', 'br.gov.bcb.pix') + formatField('01', cleanKey);
            
            let payload = 
                formatField('00', '01') +
                formatField('26', merchantAccount) +
                formatField('52', '0000') +
                formatField('53', '986') +
                formatField('54', value) +
                formatField('58', 'BR') +
                formatField('59', cleanName) +
                formatField('60', cleanCity) +
                formatField('62', formatField('05', '***')) +
                '6304';

            return payload + crc16(payload);
        }

        function crc16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= (str.charCodeAt(i) << 8);
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) {
                        crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                    } else {
                        crc = (crc << 1) & 0xFFFF;
                    }
                }
            }
            return crc.toString(16).toUpperCase().padStart(4, '0');
        }
    </script>
</body>
</html>
