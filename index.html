<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Barber Shop - Links</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Gerador de QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Container Principal */
        .card {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 24px;
            padding: 40px 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
        }

        /* Avatar / Logo */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            padding: 3px;
            margin: 0 auto 16px;
            object-fit: cover;
            background: #101010;
        }

        /* Títulos */
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 13px;
            color: #d4af37;
            font-weight: 600;
            margin-bottom: 32px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Lista de Links */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background: #222222;
            border: 1px solid #333333;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn i {
            font-size: 18px;
            color: #d4af37;
            transition: color 0.3s ease;
        }

        .btn:hover {
            border-color: #d4af37;
            background: #2a2a2a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.15);
        }

        /* Notificação Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #d4af37;
            color: #000000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 200;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Modal do PIX */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: #1c1c1c;
            border: 1px solid #d4af37;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 18px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
        }

        .modal-title {
            color: #d4af37;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .input-group {
            margin: 20px 0 15px 0;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background: #101010;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .input-group input:focus {
            border-color: #d4af37;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        .qr-section {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #333;
        }

        #qrcode {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
            margin: 15px 0;
        }

        .copy-box {
            background: #101010;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            color: #888;
            word-break: break-all;
            margin-bottom: 10px;
            max-height: 50px;
            overflow-y: auto;
        }
    </style>
</head>

    <div class="card">
        <!-- Ícone / Logo -->
        <div
