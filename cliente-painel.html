<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMPÉRIO DIGITAL | Área do Cliente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --bg-card: #14151c;
      --bg-input: #0d0e12;
      --primary: #e8b84a;
      --text: #ffffff;
      --text-muted: #8e8f9e;
      --border: #1e1f29;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }

    .container { width: 100%; max-width: 480px; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-icon { font-size: 36px; color: var(--primary); margin-bottom: 8px; }
    .brand-title { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
    .brand-sub { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

    /* ABAS LOGIN / CADASTRO */
    .tabs { display: flex; background: var(--bg-input); border-radius: 10px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); font-weight: 600; font-size: 13px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--primary); color: #101114; font-weight: 700; }

    .input-group { margin-bottom: 14px; }
    .input-group label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
    .input-group label i { color: var(--primary); }
    .input-field { width: 100%; padding: 12px 14px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; color: white; outline: none; font-size: 14px; transition: 0.2s; }
    .input-field:focus { border-color: var(--primary); }

    .btn-main { width: 100%; padding: 14px; background: var(--primary); color: #101114; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-main:hover { opacity: 0.9; }
    
    .btn-view { width: 100%; padding: 12px; background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid var(--success); border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; margin-top: 10px; }
    .btn-logout { width: 100%; padding: 10px; background: transparent; color: var(--danger); border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 12px; }

    .status-alert { font-size: 12px; text-align: center; margin-top: 12px; font-weight: 600; padding: 10px; border-radius: 8px; }
    .alert-warning { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .alert-success { background: rgba(34, 197, 94, 0.15); color: var(--success); }
