<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMPÉRIO DIGITAL | Painel Master</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark:#0a0b0e; --bg-sidebar:#0f1015; --bg-card:#14151c;
      --bg-input:#0d0e12; --primary:#e8b84a; --text:#fff;
      --text-muted:#8e8f9e; --border:#1e1f29; --success:#22c55e; --danger:#ef4444;
    }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; }
    body { background:var(--bg-dark); color:var(--text); min-height:100vh; }
    .app-layout { display:flex; flex-direction:column; width:100%; min-height:100vh; }
    aside { width:100%; background:var(--bg-sidebar); border-bottom:1px solid var(--border); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand-area { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand-icon { color:var(--primary); font-size:24px; }
    .brand-name { font-size:16px; font-weight:800; color:var(--primary); letter-spacing:.5px; }
    .brand-sub { font-size:9px; color:var(--text-muted); text-transform:uppercase; overflow-wrap:anywhere; }
    nav { display:none; }
    main { flex:1; padding:16px; width:100%; max-width:1200px; margin:0 auto; }
    .card,.site-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; }
    .input-group { margin-bottom:12px; min-width:0; }
    .input-group label { display:block; font-size:11px; color:var(--text-muted); margin-bottom:4px; text-transform:uppercase; }
    .input-field { width:100%; padding:12px; background:var(--bg-input); border:1px solid var(--border); border-radius:8px; color:white; outline:none; font-size:14px; }
    .input-field:focus { border-color:var(--primary); }
    .btn-main,.btn-secondary { width:100%; padding:12px 20px; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; }
    .btn-main { background:var(--primary); color:#101114; }
    .btn-secondary { padding:10px; background:#232430; color:white; font-size:13px; margin-top:8px; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .site-card { padding:16px; margin-bottom:12px; }
    .site-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; }
    .site-header > div { min-width:0; overflow-wrap:anywhere; }
    .badge { padding:4px 8px; border-radius:12px; font-size:10px; font-weight:bold; white-space:nowrap; }
    .badge-active { background:rgba(34,197,94,.15); color:var(--success); }
    .badge-inactive { background:rgba(239,68,68,.15); color:var(--danger); }
    .action-row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .btn-act { flex:1; padding:10px; border:none; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; min-width:100px; }
    .btn-act-edit { background:var(--primary); color:#101114; }
    .btn-act-view { background:#232430; color:white; }
    .btn-act-toggle { background:rgba(34,197,94,.2); color:var(--success); }
    .btn-act-delete { background:rgba(239,68,68,.2); color:var(--danger); }
    .login-wrapper { display:flex; min-height:80vh; align-items:center; justify-content:center; padding:16px; }
    .section-title { font-size:14px; font-weight:bold; color:var(--primary); margin:16px 0 10px; border-bottom:1px dashed var(--border); padding-bottom:6px; text-transform:uppercase; }
    .status { margin-top:12px; font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
    .grid-2,.grid-3 { display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width:768px) {
      .app-layout { flex-direction:row; }
      aside { width:260px; flex-shrink:0; border-bottom:none; border-right:1px solid var(--border); flex-direction:column; justify-content:space-between; padding:24px; align-items:flex-start; }
      .brand-icon { font-size:32px; }
      .brand-name { font-size:18px; }
      nav { display:flex; flex-direction:column; gap:8px; width:100%; margin-top:30px; }
      .nav-item { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:10px; color:var(--text-muted); text-decoration:none; font-size:14px; font-weight:600; cursor:pointer; }
      .nav-item:hover,.nav-item.active { background:var(--primary); color:#101114; }
      main { padding:32px; }
      .grid-2 { grid-template-columns:1fr 1fr; }
      .grid-3 { grid-template-columns:1fr 1fr 1fr; }
      .btn-main { width:auto; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="login-wrapper">
      <div class="card" style="width:100%;max-width:380px;">
        <div class="brand-area" style="justify-content:center;margin-bottom:20px;">
          <i class="fa-solid fa-crown brand-icon"></i>
          <div><div class="brand-name">IMPÉRIO DIGITAL</div><div class="brand-sub">Painel do Administrador</div></div>
        </div>
        <form id="loginForm">
          <div class="input-group"><label for="email">E-mail</label><input type="email" id="email" class="input-field" placeholder="seuemail@exemplo.com" autocomplete="username" required></div>
          <div class="input-group"><label for="password">Senha</label><input type="password" id="password" class="input-field" placeholder="Sua senha" autocomplete="current-password" required></div>
          <button type="submit" id="loginBtn" class="btn-main" style="width:100%;margin-top:8px;">Entrar no Painel</button>
        </form>
        <p id="statusMsg" class="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://hqoqbjwjjmnhctjizvcs.supabase.co';
    // Chave publishable destinada ao navegador. Nunca coloque service_role/secret key neste arquivo.
    const SUPABASE_KEY = 'sb_publishable_QK2T4-OP6omrbgGmTwbmsw_VKfgeFuk';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const root = document.getElementById('root');

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[ch]));

    function mostrarStatus(message, tipo = 'erro') {
      const el = document.getElementById('statusMsg');
      if (!el) return;
      el.style.color = tipo === 'sucesso' ? 'var(--success)' : tipo === 'aviso' ? 'var(--primary)' : 'var(--danger)';
      el.textContent = message;
    }

    async function verificarAdministrador(user) {
      // Supõe profiles.id = auth.users.id e profiles.role = 'admin'.
      const { data: perfil, error } = await supabase
        .from('profiles').select('role').eq('id', user.id).maybeSingle();

      if (error) {
        throw new Error('Não foi possível verificar seu perfil. Confira a tabela profiles e suas políticas RLS.');
      }
      if (perfil?.role !== 'admin') {
        await supabase.auth.signOut();
        throw new Error('Esta conta não tem permissão de administrador.');
      }
    }

    async function init() {
      try {
        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (data.session?.user) {
          await verificarAdministrador(data.session.user);
          renderPainel(data.session.user);
        }
      } catch (err) {
        mostrarStatus(err.message || 'Não foi possível iniciar o painel.');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      if (!email || !password) return mostrarStatus('Preencha o e-mail e a senha.');
      btn.disabled = true;
      btn.textContent = 'Autenticando...';
      mostrarStatus('Verificando acesso...', 'aviso');

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await verificarAdministrador(data.user);
        renderPainel(data.user);
      } catch (err) {
        mostrarStatus(err.message || 'Erro ao entrar no painel.');
        btn.disabled = false;
        btn.textContent = 'Entrar no Painel';
      }
    });

    function renderPainel(user) {
      root.innerHTML = `
        <div class="app-layout">
          <aside>
            <div style="width:100%">
              <div class="brand-area">
                <i class="fa-solid fa-crown brand-icon"></i>
                <div><div class="brand-name">IMPÉRIO DIGITAL</div><div class="brand-sub">${escapeHtml(user.email)}</div></div>
              </div>
              <nav>
                <a class="nav-item active" href="#" id="btnNavDashboard"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a class="nav-item" href="#" id="btnNavNovo"><i class="fa-solid fa-plus"></i> Cadastrar Site</a>
              </nav>
            </div>
            <button type="button" id="sairBtn" class="btn-secondary"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
          </aside>
          <main>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
              <h2>Gerenciador de Sites</h2>
              <button type="button" id="btnNovo" class="btn-main">+ Novo Cliente</button>
            </div>
            <div id="formContainer"></div>
            <div id="sitesList" aria-live="polite">Carregando sites...</div>
          </main>
        </div>`;

      document.getElementById('sairBtn').onclick = async () => {
        const { error } = await supabase.auth.signOut();
        if (error) alert('Não foi possível sair: ' + error.message);
        else location.reload();
      };
      document.getElementById('btnNovo').onclick = mostrarFormNovo;
      document.getElementById('btnNavNovo').onclick = (e) => { e.preventDefault(); mostrarFormNovo(); };
      document.getElementById('btnNavDashboard').onclick = (e) => { e.preventDefault(); document.getElementById('formContainer').innerHTML = ''; carregarSites(); };
      carregarSites();
    }

    async function carregarSites() {
      const sitesList = document.getElementById('sitesList');
      if (!sitesList) return;
      sitesList.textContent = 'Carregando sites...';
      const { data, error } = await supabase.from('sites').select('*').order('created_at', { ascending: false });
      if (error) {
        sitesList.innerHTML = `<p style="color:var(--danger)">Erro ao carregar sites: ${escapeHtml(error.message)}</p>`;
        return;
      }
      if (!data?.length) {
        sitesList.innerHTML = '<div class="card">Nenhum site cadastrado ainda.</div>';
        return;
      }

      sitesList.innerHTML = '';
      data.forEach(site => {
        const content = site.content && typeof site.content === 'object' ? site.content : {};
        const div = document.createElement('div');
        div.className = 'site-card';
        div.innerHTML = `
          <div class="site-header">
            <div>
              <strong style="font-size:16px;">${escapeHtml(site.name)}</strong>
              <div style="font-size:12px;color:var(--text-muted);margin-top:2px;"><strong>URL Slug:</strong> /${escapeHtml(site.slug)}</div>
              <div style="font-size:12px;margin-top:4px;">
                ${content.clientEmail ? `<span style="color:var(--success);font-weight:bold;">👤 Cliente vinculado: ${escapeHtml(content.clientEmail)}</span>` : '<span style="color:var(--danger);font-weight:bold;">⚠️ Nenhum e-mail de cliente vinculado</span>'}
              </div>
            </div>
            <span class="badge ${site.published ? 'badge-active' : 'badge-inactive'}">${site.published ? 'Ativo' : 'Inativo'}</span>
          </div>
          <div class="action-row">
            <button type="button" class="btn-act btn-act-edit btn-edit"><i class="fa-solid fa-pen"></i> Editar & Vínculo</button>
            <a href="https://riquelmedasilvadiassilva010-prog.github.io/links-imperio/cliente.html?slug=${encodeURIComponent(site.slug || '')}" target="_blank" rel="noopener noreferrer" class="btn-act btn-act-view"><i class="fa-solid fa-eye"></i> Ver Site</a>
            <button type="button" class="btn-act btn-act-toggle btn-toggle">${site.published ? 'Desativar' : 'Ativar'}</button>
            <button type="button" class="btn-act btn-act-delete btn-delete"><i class="fa-solid fa-trash"></i> Apagar</button>
          </div>`;

        div.querySelector('.btn-toggle').onclick = async () => {
          if (!confirm(`${site.published ? 'Desativar' : 'Ativar'} o site "${site.name}"?`)) return;
          const { error } = await supabase.from('sites').update({ published: !site.published }).eq('id', site.id);
          if (error) return alert('Não foi possível alterar a publicação: ' + error.message);
          await carregarSites();
        };
        div.querySelector('.btn-edit').onclick = () => abrirEditor(site);
        div.querySelector('.btn-delete').onclick = async () => {
          if (!confirm(`Tem certeza que deseja apagar definitivamente o site "${site.name}"? Esta ação não pode ser desfeita.`)) return;
          const { error } = await supabase.from('sites').delete().eq('id', site.id);
          if (error) return alert('Não foi possível apagar o site: ' + error.message);
          await carregarSites();
        };
        sitesList.appendChild(div);
      });
    }

    function mostrarFormNovo() {
      const container = document.getElementById('formContainer');
      container.innerHTML = `
        <div class="card" style="border-color:var(--primary);">
          <h3>+ Cadastrar Novo Cliente/Site</h3>
          <p style="font-size:12px;color:var(--text-muted);margin-top:6px;">Este formulário vincula o e-mail ao conteúdo do site. A autorização real do cliente também precisa ser validada no Supabase e no portal do cliente.</p>
          <div class="grid-2" style="margin-top:12px;">
            <div class="input-group"><label for="nNome">Nome do negócio</label><input id="nNome" class="input-field" placeholder="Ex.: Império Barber" maxlength="120"></div>
            <div class="input-group"><label for="nSlug">Identificador / URL</label><input id="nSlug" class="input-field" placeholder="Ex.: imperio-barber" maxlength="80"></div>
            <div class="input-group" style="grid-column:1/-1"><label for="nClientEmail">E-mail do cliente</label><input id="nClientEmail" type="email" class="input-field" placeholder="cliente@exemplo.com"></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
            <button type="button" id="salvarNovo" class="btn-main">Salvar site</button>
            <button type="button" id="cancelarNovo" class="btn-secondary" style="margin-top:0;">Cancelar</button>
          </div>
          <p id="msgNovo" class="status" role="status"></p>
        </div>`;
      document.getElementById('cancelarNovo').onclick = () => container.innerHTML = '';
      document.getElementById('salvarNovo').onclick = async () => {
        const btn = document.getElementById('salvarNovo');
        const msg = document.getElementById('msgNovo');
        const nome = document.getElementById('nNome').value.trim();
        const slug = document.getElementById('nSlug').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
        const clientEmail = document.getElementById('nClientEmail').value.trim().toLowerCase();
        if (!nome || !slug) { msg.style.color = 'var(--danger)'; msg.textContent = 'Preencha o nome e o identificador.'; return; }
        if (clientEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clientEmail)) { msg.style.color = 'var(--danger)'; msg.textContent = 'Confira o e-mail do cliente.'; return; }
        btn.disabled = true; msg.style.color = 'var(--text-muted)'; msg.textContent = 'Salvando...';
        try {
          const { data: { user }, error: userError } = await supabase.auth.getUser();
          if (userError || !user) throw new Error('Sua sessão expirou. Entre novamente.');
          const { error } = await supabase.from('sites').insert({
            owner_id:user.id, name:nome, slug, content:{ clientEmail }, published:false
          });
          if (error) throw error;
          msg.style.color = 'var(--success)'; msg.textContent = 'Site cadastrado como não publicado.';
          await carregarSites();
          setTimeout(() => { if (container.isConnected) container.innerHTML = ''; }, 700);
        } catch (err) {
          msg.style.color = 'var(--danger)'; msg.textContent = 'Erro ao cadastrar: ' + (err.message || 'erro desconhecido');
          btn.disabled = false;
        }
      };
    }

    function abrirEditor(site) {
      const container = document.getElementById('formContainer');
      const c = site.content && typeof site.content === 'object' ? site.content : {};
      container.innerHTML = `
        <div class="card" style="border-color:var(--primary);">
          <h3 style="font-size:18px;">🛠️ Editar site: ${escapeHtml(site.name)}</h3>
          <div class="section-title"><i class="fa-solid fa-user-lock"></i> Vínculo do cliente</div>
          <div class="input-group"><label for="eClientEmail">E-mail da conta do cliente</label><input id="eClientEmail" type="email" class="input-field" value="${escapeHtml(c.clientEmail || '')}" placeholder="cliente@exemplo.com"></div>
          <div class="section-title"><i class="fa-solid fa-address-book"></i> Informações do negócio</div>
          <div class="grid-2">
            <div class="input-group"><label for="eNome">Nome do negócio</label><input id="eNome" class="input-field" maxlength="120" value="${escapeHtml(site.name)}"></div>
            <div class="input-group"><label for="eSlug">Identificador / URL</label><input id="eSlug" class="input-field" maxlength="80" value="${escapeHtml(site.slug)}"></div>
            <div class="input-group"><label for="eWhats">WhatsApp (números)</label><input id="eWhats" class="input-field" value="${escapeHtml(c.whatsapp || '')}"></div>
            <div class="input-group"><label for="eInsta">Instagram (@)</label><input id="eInsta" class="input-field" value="${escapeHtml(c.instagram || '')}"></div>
            <div class="input-group"><label for="ePix">Chave Pix</label><input id="ePix" class="input-field" value="${escapeHtml(c.pix || '')}"></div>
            <div class="input-group"><label for="eWifiNome">Nome do Wi-Fi</label><input id="eWifiNome" class="input-field" value="${escapeHtml(c.wifiNome || '')}"></div>
            <div class="input-group"><label for="eWifiSenha">Senha do Wi-Fi</label><input id="eWifiSenha" class="input-field" value="${escapeHtml(c.wifiSenha || '')}"></div>
            <div class="input-group"><label for="eMaps">Link do Google Maps/avaliação</label><input id="eMaps" class="input-field" value="${escapeHtml(c.maps || '')}"></div>
          </div>
          <div class="section-title"><i class="fa-solid fa-palette"></i> Design e identidade visual</div>
          <div class="grid-3">
            <div class="input-group"><label for="eBgColor">Cor de fundo</label><input type="color" id="eBgColor" class="input-field" value="${escapeHtml(c.bgColor || '#0a0b0e')}" style="height:44px;padding:4px;"></div>
            <div class="input-group"><label for="eCardColor">Cor dos cartões</label><input type="color" id="eCardColor" class="input-field" value="${escapeHtml(c.cardColor || '#14151c')}" style="height:44px;padding:4px;"></div>
            <div class="input-group"><label for="ePrimaryColor">Cor de destaque</label><input type="color" id="ePrimaryColor" class="input-field" value="${escapeHtml(c.primaryColor || '#e8b84a')}" style="height:44px;padding:4px;"></div>
            <div class="input-group"><label for="eTextColor">Cor do texto</label><input type="color" id="eTextColor" class="input-field" value="${escapeHtml(c.textColor || '#ffffff')}" style="height:44px;padding:4px;"></div>
            <div class="input-group"><label for="eFont">Fonte</label><select id="eFont" class="input-field">
              <option value="system-ui" ${c.font === 'system-ui' ? 'selected' : ''}>Padrão (System UI)</option>
              <option value="'Poppins', sans-serif" ${String(c.font || '').includes('Poppins') ? 'selected' : ''}>Poppins</option>
              <option value="'Montserrat', sans-serif" ${String(c.font || '').includes('Montserrat') ? 'selected' : ''}>Montserrat</option>
              <option value="'Playfair Display', serif" ${String(c.font || '').includes('Playfair') ? 'selected' : ''}>Playfair Display</option>
              <option value="'Bebas Neue', cursive" ${String(c.font || '').includes('Bebas') ? 'selected' : ''}>Bebas Neue</option>
            </select></div>
            <div class="input-group"><label for="eBtnStyle">Formato dos botões</label><select id="eBtnStyle" class="input-field">
              <option value="12px" ${c.btnRadius === '12px' || !c.btnRadius ? 'selected' : ''}>Suave (12px)</option>
              <option value="30px" ${c.btnRadius === '30px' ? 'selected' : ''}>Pílula (30px)</option>
              <option value="0px" ${c.btnRadius === '0px' ? 'selected' : ''}>Quadrado (0px)</option>
            </select></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;">
            <button type="button" id="salvarEdicao" class="btn-main">💾 Salvar alterações</button>
            <button type="button" id="fecharEdicao" class="btn-secondary" style="margin-top:0;">Fechar</button>
          </div>
          <p id="msgEdit" class="status" role="status"></p>
        </div>`;

      document.getElementById('fecharEdicao').onclick = () => container.innerHTML = '';
      document.getElementById('salvarEdicao').onclick = async () => {
        const btn = document.getElementById('salvarEdicao');
        const msg = document.getElementById('msgEdit');
        const nome = document.getElementById('eNome').value.trim();
        const slug = document.getElementById('eSlug').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
        const email = document.getElementById('eClientEmail').value.trim().toLowerCase();
        if (!nome || !slug) { msg.style.color = 'var(--danger)'; msg.textContent = 'Preencha o nome e o identificador.'; return; }
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.style.color = 'var(--danger)'; msg.textContent = 'Confira o e-mail do cliente.'; return; }
        btn.disabled = true; msg.style.color = 'var(--text-muted)'; msg.textContent = 'Salvando alterações...';
        const updatedContent = {
          ...c,
          clientEmail:email,
          whatsapp:document.getElementById('eWhats').value.trim(),
          instagram:document.getElementById('eInsta').value.trim(),
          pix:document.getElementById('ePix').value.trim(),
          wifiNome:document.getElementById('eWifiNome').value.trim(),
          wifiSenha:document.getElementById('eWifiSenha').value.trim(),
          maps:document.getElementById('eMaps').value.trim(),
          bgColor:document.getElementById('eBgColor').value,
          cardColor:document.getElementById('eCardColor').value,
          primaryColor:document.getElementById('ePrimaryColor').value,
          textColor:document.getElementById('eTextColor').value,
          font:document.getElementById('eFont').value,
          btnRadius:document.getElementById('eBtnStyle').value
        };
        try {
          const { error } = await supabase.from('sites').update({ name:nome, slug, content:updatedContent }).eq('id', site.id);
          if (error) throw error;
          msg.style.color = 'var(--success)'; msg.textContent = 'Alterações salvas no banco de dados.';
          await carregarSites();
          setTimeout(() => { if (container.isConnected) container.innerHTML = ''; }, 900);
        } catch (err) {
          msg.style.color = 'var(--danger)'; msg.textContent = 'Erro ao salvar: ' + (err.message || 'erro desconhecido');
          btn.disabled = false;
        }
      };
    }

    init();
  </script>
</body>
</html>
