<!DOCTYPE html> 
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JRB Digital | Painel de Controle</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0e12; color: #e1e1e6;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 20px;
    }
    main {
      width: 100%; max-width: 480px; padding: 28px;
      background: #17181f; border: 1px solid #2a2b36;
      border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1, h2 { margin-top: 0; color: #e8b84a; }
    p { color: #a8a9b3; line-height: 1.5; font-size: 14px; }
    label { display: block; margin-top: 14px; font-size: 13px; color: #e8b84a; font-weight: bold; }
    input {
      width: 100%; padding: 12px; margin-top: 6px;
      border: 1px solid #333545; border-radius: 10px;
      background: #0d0e12; color: white; font-size: 15px; outline: none;
    }
    input:focus { border-color: #e8b84a; }
    button {
      width: 100%; padding: 14px; margin-top: 14px;
      border: 0; border-radius: 10px; cursor: pointer;
      background: #e8b84a; color: #101114;
      font-size: 15px; font-weight: bold; transition: 0.2s;
    }
    button:hover { opacity: 0.9; }
    .card-site {
      border: 1px solid #2a2b36; padding: 16px; margin: 14px 0;
      border-radius: 14px; background: #101114;
    }
  </style>
</head>
<body>
  <main>
    <h1>JRB DIGITAL</h1>
    <p>Painel de gerenciamento de links e serviços.</p>

    <form id="loginForm">    
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="Seu e-mail" required>

      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Sua senha" required>

      <button id="loginButton" type="submit">Entrar no Painel</button>
    </form>

    <p id="status" role="status" style="margin-top:15px; text-align:center;">Aguardando login...</p>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://hqoqbjwjjmnhctjizvcs.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_QK2T4-OP6omrbgGmTwbmsw_VKfgeFuk';

    const status = document.getElementById('status');
    const button = document.getElementById('loginButton');
    const form = document.getElementById('loginForm');

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = 'Verificando acesso...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        if (error) throw error;

        const { data: profile } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .single();

        const userRole = profile?.role || 'user';

        status.textContent = 'Login efetuado com sucesso!';
        document.querySelector('main').innerHTML = `
          <h2>SITES & SERVIÇOS</h2>
          <p>Gerencie as informações do seu site dinâmico em tempo real.</p>

          <div id="secaoAdmin" style="display:${userRole === 'admin' ? 'block' : 'none'};">
            <button id="cadastrarSite">+ Novo Site de Cliente</button>

            <section id="formularioSite" style="display:none; margin-top:15px; background:#101114; padding:15px; border-radius:12px;">
              <h3 style="color:#e8b84a; margin:0 0 10px 0;">Cadastrar Cliente</h3>
              <input id="nomeSite" placeholder="Nome do Negócio (ex: Império Barber)">
              <input id="slugSite" placeholder="Identificador / URL (ex: imperio)">
              <button id="salvarSite">Salvar Site</button>
              <button id="cancelarSite" style="background:#333545; color:white;">Cancelar</button>
              <p id="mensagemSite"></p>
            </section>
          </div>

          <div id="listaSites">Carregando sites...</div>

          <button id="sairPainel" style="background:#333545; color:white; margin-top:20px;">Sair do Painel</button>
        `;

        const formularioSite = document.getElementById('formularioSite');
        const listaSites = document.getElementById('listaSites');

        if (document.getElementById('cadastrarSite')) {
          document.getElementById('cadastrarSite').onclick = () => { formularioSite.style.display = 'block'; };
          document.getElementById('cancelarSite').onclick = () => { formularioSite.style.display = 'none'; };
        }

        document.getElementById('sairPainel').onclick = async () => {
          await supabase.auth.signOut();
          location.reload();
        };

        async function carregarSites() {
          listaSites.textContent = 'Carregando dados...';

          const { data, error } = await supabase
            .from('sites')
            .select('id, name, slug, published, content')
            .order('created_at', { ascending: false });

          if (error) {
            listaSites.textContent = 'Erro ao carregar: ' + error.message;
            return;
          }

          if (!data || data.length === 0) {
            listaSites.textContent = 'Nenhum site encontrado.';
            return;
          }

          listaSites.innerHTML = '';

          data.forEach(site => {
            const item = document.createElement('div');
            item.className = 'card-site';

            const nome = document.createElement('strong');
            nome.style.cssText = 'font-size:18px; color:#e8b84a; display:block;';
            nome.textContent = site.name;

            const slug = document.createElement('p');
            slug.style.margin = '4px 0 8px 0';
            slug.textContent = 'URL: /' + site.slug;

            const statusSite = document.createElement('p');
            statusSite.style.cssText = `font-weight:bold; color:${site.published ? '#4ade80' : '#f87171'}; margin-bottom:10px;`;
            statusSite.textContent = site.published ? '● Status: Publicado (Online)' : '○ Status: Desativado';

            const btnEditar = document.createElement('button');
            btnEditar.textContent = '⚙️ Gerenciar Informações';

            const btnPublicar = document.createElement('button');
            btnPublicar.textContent = site.published ? 'Desativar Site' : 'Publicar Site';
            btnPublicar.style.background = site.published ? '#f87171' : '#4ade80';
            btnPublicar.style.color = '#101114';

            btnPublicar.onclick = async () => {
              btnPublicar.disabled = true;
              await supabase.from('sites').update({ published: !site.published }).eq('id', site.id);
              await carregarSites();
            };

            const linkVer = document.createElement('a');
            linkVer.href = `https://riquelmedasilvadiassilva010-prog.github.io/links-imperio/cliente.html?slug=${site.slug}`;
            linkVer.target = '_blank';
            linkVer.textContent = '🔗 Ver Site do Cliente';
            linkVer.style.cssText = 'display:block; margin-top:12px; color:#e8b84a; font-size:14px; text-decoration:none; text-align:center;';

            btnEditar.onclick = () => {
              const editorAntigo = document.getElementById('editorSite');
              if (editorAntigo) editorAntigo.remove();

              const editor = document.createElement('section');
              editor.id = 'editorSite';
              editor.style.cssText = 'border:1px solid #e8b84a; padding:16px; margin-top:16px; border-radius:14px; background:#17181f;';

              editor.innerHTML = `
                <h3 style="color:#e8b84a; margin-top:0;">Editar Informações do Site</h3>

                <label>Nome do Negócio</label>
                <input id="editarNome" value="${site.name}">

                <label>📱 Número do WhatsApp (somente números)</label>
                <input id="inputWhats" placeholder="Ex: 5598912345678" value="${site.content?.whatsapp || ''}">

                <label>📸 Instagram (@ do perfil)</label>
                <input id="inputInsta" placeholder="Ex: imperio_barbershop10" value="${site.content?.instagram || ''}">

                <label>💲 Chave Pix</label>
                <input id="inputPix" placeholder="Ex: CNPJ, E-mail ou Telefone" value="${site.content?.pix || ''}">

                <label>📶 Nome da Rede Wi-Fi</label>
                <input id="inputWifiNome" placeholder="Ex: JRDL-ST1-6G" value="${site.content?.wifiNome || ''}">

                <label>🔑 Senha do Wi-Fi</label>
                <input id="inputWifiSenha" placeholder="Ex: Ri01Da28Ju14#" value="${site.content?.wifiSenha || ''}">

                <label>📍 Link de Localização (Google Maps)</label>
                <input id="inputMaps" placeholder="https://maps.google.com/..." value="${site.content?.maps || ''}">

                <label>🖼️ URL do Logotipo (Imagem)</label>
                <input id="logoSite" type="url" placeholder="https://..." value="${site.content?.logo || ''}">

                <button id="salvarEdicao">💾 Salvar Alterações</button>
                <button id="fecharEditor" style="background:#333545; color:white;">Fechar</button>
                <p id="mensagemEdicao" style="text-align:center; font-weight:bold;"></p>
              `;

              listaSites.before(editor);

              document.getElementById('fecharEditor').onclick = () => editor.remove();

              document.getElementById('salvarEdicao').onclick = async () => {
                const btnSalvar = document.getElementById('salvarEdicao');
                const mensagem = document.getElementById('mensagemEdicao');
                btnSalvar.disabled = true;
                mensagem.textContent = 'Salvando no banco de dados...';

                try {
                  const { error } = await supabase
                    .from('sites')
                    .update({
                      name: document.getElementById('editarNome').value.trim(),
                      content: {
                        ...(site.content || {}),
                        whatsapp: document.getElementById('inputWhats').value.trim(),
                        instagram: document.getElementById('inputInsta').value.trim(),
                        pix: document.getElementById('inputPix').value.trim(),
                        wifiNome: document.getElementById('inputWifiNome').value.trim(),
                        wifiSenha: document.getElementById('inputWifiSenha').value.trim(),
                        maps: document.getElementById('inputMaps').value.trim(),
                        logo: document.getElementById('logoSite').value.trim()
                      }
                    })
                    .eq('id', site.id);

                  if (error) throw error;

                  mensagem.style.color = '#4ade80';
                  mensagem.textContent = ' Alterações salvas com sucesso!';
                  setTimeout(async () => {
                    await carregarSites();
                    editor.remove();
                  }, 1200);
                } catch (err) {
                  mensagem.style.color = '#f87171';
                  mensagem.textContent = 'Erro ao salvar: ' + err.message;
                  btnSalvar.disabled = false;
                }
              };
            };

            item.append(nome, slug, statusSite, btnEditar, btnPublicar, linkVer);
            listaSites.appendChild(item);
          });
        }

        if (document.getElementById('salvarSite')) {
          document.getElementById('salvarSite').onclick = async () => {
            const nome = document.getElementById('nomeSite').value.trim();
            const slug = document.getElementById('slugSite').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');

            if (!nome || !slug) return;

            const { data: { user } } = await supabase.auth.getUser();

            await supabase.from('sites').insert({
              owner_id: user.id,
              name: nome,
              slug: slug,
              content: {},
              published: false
            });

            formularioSite.style.display = 'none';
            await carregarSites();
          };
        }

        carregarSites();
      } catch (err) {
        status.textContent = 'Erro de login: ' + err.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
