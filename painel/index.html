<!DOCTYPE html> 
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JRB Digital | Dashboard Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-body: #0a0b0e;
      --bg-card: #14151c;
      --bg-input: #0d0e13;
      --primary: #e8b84a;
      --primary-hover: #d4a338;
      --text: #ffffff;
      --text-muted: #8e8f9e;
      --border: #232430;
      --success: #4ade80;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: var(--bg-body); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 16px;
    }

    /* Container Principal */
    .dashboard {
      width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px;
    }

    /* Topbar Header */
    .header-bar {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 18px; padding: 18px 20px; display: flex;
      align-items: center; justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 40px; height: 40px; background: linear-gradient(135deg, #e8b84a, #997320);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      color: #101114; font-weight: 900; font-size: 18px;
    }
    .brand-title { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: 0.5px; }
    .brand-sub { font-size: 11px; color: var(--primary); font-weight: 600; text-transform: uppercase; }

    /* Login Box */
    .login-box {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { font-size: 20px; color: var(--primary); margin-bottom: 6px; }
    p.desc { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.4; }

    /* Form Inputs */
    .field-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input {
      width: 100%; padding: 12px 14px; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: 10px; color: white;
      font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }

    /* Botões Gerais */
    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: var(--primary); color: #101114; font-size: 14px;
      font-weight: 700; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-secondary { background: #232430; color: white; }
    .btn-secondary:hover { background: #2d2e3d; }
    .btn-danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); }
    .btn-danger:hover { background: var(--danger); color: black; }

    /* Metric Cards */
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .metric-card {
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 16px; border-radius: 16px; text-align: center;
    }
    .metric-num { font-size: 24px; font-weight: 800; color: var(--primary); }
    .metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

    /* Cards dos Sites */
    .site-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
      position: relative; overflow: hidden;
    }
    .site-card-header { display: flex; justify-content: space-between; align-items: center; }
    .site-name { font-size: 17px; font-weight: 700; color: white; }
    .site-slug { font-size: 12px; color: var(--text-muted); }
    
    .status-badge {
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
    }
    .status-online { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.2); }
    .status-offline { background: rgba(248, 113, 113, 0.1); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.2); }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    
    /* Painel Modal / Gaveta de Edição */
    .editor-modal {
      background: var(--bg-card); border: 1px solid var(--primary);
      border-radius: 20px; padding: 20px; margin-bottom: 16px;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .section-title {
      font-size: 13px; font-weight: 800; color: var(--primary);
      border-bottom: 1px solid var(--border); padding-bottom: 6px;
      margin: 16px 0 12px 0; text-transform: uppercase; letter-spacing: 0.5px;
    }
  </style>
</head>
