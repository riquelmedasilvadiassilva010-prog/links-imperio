
<!DOCTYPE html> 
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Império Digital | Painel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #101114; color: white;
      min-height: 100vh; display: grid; place-items: center;
      padding: 20px;
    }
    main {
      width: 100%; max-width: 420px; padding: 28px;
      background: #1b1c21; border: 1px solid #33353d;
      border-radius: 18px;
    }
    h1 { margin-top: 0; color: #e8b84a; }
    p { color: #c4c5cc; line-height: 1.5; }
    label { display: block; margin-top: 16px; }
    input {
      width: 100%; padding: 13px; margin-top: 7px;
      border: 1px solid #444650; border-radius: 9px;
      background: #101114; color: white; font-size: 16px;
    }
    button {
      width: 100%; padding: 14px; margin-top: 20px;
      border: 0; border-radius: 9px; cursor: pointer;
      background: #e8b84a; color: #171717;
      font-size: 16px; font-weight: bold;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>IMPÉRIO DIGITAL</h1>
    <p>Entre na sua conta para acessar o painel de gerenciamento.</p>

    <form id="loginForm">    
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username"
        placeholder="Seu e-mail" required>

      <label for="password">Senha</label>
      <input id="password" type="password"
        autocomplete="current-password" placeholder="Sua senha" required>

      <button id="loginButton" type="submit">Entrar no painel</button>
    </form>
    <p>
  <a href="esqueci.html" style="color:#e8b84a">
    Esqueci minha senha
  </a>
</p>
    <p id="status" role="status">Configure a conexão para começar.</p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // Preencha com os dados do seu próprio projeto Supabase.
    const SUPABASE_URL = 'https://hqoqbjwjjmnhctjizvcs.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_QK2T4-OP6omrbgGmTwbmsw_VKfgeFuk';

    const status = document.getElementById('status');
    const button = document.getElementById('loginButton');
    const form = document.getElementById('loginForm');

    if (
      !SUPABASE_URL.startsWith('https://') ||
      !SUPABASE_URL.endsWith('.supabase.co') ||
      SUPABASE_PUBLISHABLE_KEY.startsWith('COLE_')
    ) {
      status.textContent =
        'Falta configurar a URL e a chave Publishable do Supabase no código.';
      button.disabled = true;
    } else {
      const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      status.textContent = 'Conexão configurada. Entre com sua conta.';

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        status.textContent = 'Verificando acesso...';

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          });

          if (error) throw error;

          const { data: profile, error: profileError } = await supabase
            .from('profiles')
            .select('role')
            .eq('id', data.user.id)
            .single();

          if (profileError) throw profileError;

          if (profile.role !== 'admin') {
            await supabase.auth.signOut();
            throw new Error('Sua conta não tem permissão de administrador.');
          }

          status.textContent =
            'Login confirmado! Sua conta de administrador foi validada.';
          document.querySelector('main').innerHTML = `
  <h1>IMPÉRIO DIGITAL</h1>
  <p>Bem-vindo ao painel de gerenciamento!</p>

  <button id="cadastrarSite">+ Cadastrar site</button>

  <section id="formularioSite" style="display:none; margin-top:20px;">
    <h2>Novo site</h2>
    <input id="nomeSite" placeholder="Nome do site">
    <br><br>
    <input id="slugSite" placeholder="Identificador (ex.: cliente1)">
    <br><br>
    <button id="salvarSite">Salvar site</button>
    <button id="cancelarSite">Cancelar</button>
    <p id="mensagemSite"></p>
  </section>

  <h2>Meus sites</h2>
  <div id="listaSites">Carregando sites...</div>

  <button id="sairPainel">Sair</button>
`;

const formularioSite = document.getElementById('formularioSite');
const mensagemSite = document.getElementById('mensagemSite');
const listaSites = document.getElementById('listaSites');

document.getElementById('cadastrarSite').onclick = () => {
  formularioSite.style.display = 'block';
};

document.getElementById('cancelarSite').onclick = () => {
  formularioSite.style.display = 'none';
};

document.getElementById('sairPainel').onclick = async () => {
  await supabase.auth.signOut();
  location.reload();
};

async function carregarSites() {
  listaSites.textContent = 'Carregando sites...';

  const { data, error } = await supabase
    .from('sites')
    .select('id, name, slug, published, created_at, content')

  if (error) {
    listaSites.textContent = 'Erro ao carregar: ' + error.message;
    return;
  }

  if (!data || data.length === 0) {
    listaSites.textContent = 'Nenhum site cadastrado ainda.';
    return;
  }

  listaSites.innerHTML = '';

  data.forEach(site => {
    const item = document.createElement('div');
    item.style.cssText = 'border:1px solid #888;padding:12px;margin:10px 0;';

    const nome = document.createElement('strong');
    nome.textContent = site.name;

    const slug = document.createElement('p');
    slug.textContent = 'Identificador: ' + site.slug;
    const editar = document.createElement('button');
editar.textContent = 'Editar site';


editar.onclick = () => {
  const editorAntigo = document.getElementById('editorSite');
  if (editorAntigo) editorAntigo.remove();

  const editor = document.createElement('section');
  editor.id = 'editorSite';
  editor.style.cssText =
    'border:1px solid #e8b84a;padding:16px;margin-top:16px;border-radius:12px;';

  
editor.innerHTML = `
    <h2>Personalizar site</h2>

    <label>Nome do site</label>
    <input id="editarNome" value="">

    <label>Identificador</label>
    <input id="editarSlug" value="">

    <label>Cor principal</label>
    <input id="corPrincipal" type="color" value="#e8b84a">

    <label>Cor de fundo</label>
    <input id="corFundo" type="color" value="#101114">

    <label>Link do logotipo (URL da imagem)</label>
    <input id="logoSite" type="url" placeholder="https://...">

    <button id="salvarEdicao">Salvar alterações</button>
    <button id="fecharEditor">Fechar</button>

    <p id="mensagemEdicao"></p>
  `;


  listaSites.before(editor);

  document.getElementById('editarNome').value = site.name;
  document.getElementById('editarSlug').value = site.slug;

  document.getElementById('corPrincipal').value =
  site.content?.corPrincipal || '#e8b84a';

  document.getElementById('corFundo').value =
  site.content?.corFundo || '#101114';

  document.getElementById('logoSite').value =
  site.content?.logo || '';
  document.getElementById('fecharEditor').onclick = () => {
    editor.remove();
  };

  document.getElementById('salvarEdicao').onclick = async () => {
    const nomeNovo = document.getElementById('editarNome').value.trim();
    const corPrincipal = document.getElementById('corPrincipal').value;
const corFundo = document.getElementById('corFundo').value;
const logoSite = document.getElementById('logoSite').value.trim();
    const slugNovo = document.getElementById('editarSlug').value
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9-]/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');

    const mensagem = document.getElementById('mensagemEdicao');

    if (!nomeNovo || !slugNovo) {
      mensagem.textContent = 'Preencha os dois campos.';
      return;
    }

    const botaoSalvar = document.getElementById('salvarEdicao');
    botaoSalvar.disabled = true;
    mensagem.textContent = 'Salvando...';

    try {
      
    const { error } = await supabase
    .from('sites')
    .update({
    name: nomeNovo,
    slug: slugNovo,
    content: {
      ...(site.content || {}),
      corPrincipal: corPrincipal,
      corFundo: corFundo,
      logo: logoSite
    }
  })
  .eq('id', site.id);


      if (error) throw error;

      mensagem.textContent = 'Alterações salvas!';
      await carregarSites();
      editor.remove();
    } catch (error) {
      mensagem.textContent = 'Erro ao salvar: ' + error.message;
    } finally {
      botaoSalvar.disabled = false;
    }
  };
};

    
    const status = document.createElement('p');
    status.textContent = site.published ? 'Publicado' : 'Não publicado';

    item.append(nome, slug, status, editar);
    listaSites.appendChild(item);
  });
}

document.getElementById('salvarSite').onclick = async () => {
  const nome = document.getElementById('nomeSite').value.trim();
  const slug = document.getElementById('slugSite').value
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9-]/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');

  if (!nome || !slug) {
    mensagemSite.textContent = 'Preencha os dois campos.';
    return;
  }

  const { data: { user }, error: erroUsuario } =
    await supabase.auth.getUser();

  if (erroUsuario || !user) {
    mensagemSite.textContent = 'Entre novamente no painel.';
    return;
  }

  const botao = document.getElementById('salvarSite');
  botao.disabled = true;
  mensagemSite.textContent = 'Salvando...';

  try {
    const { error } = await supabase.from('sites').insert({
      owner_id: user.id,
      name: nome,
      slug: slug,
      content: {},
      published: false
    });

    if (error) {
      mensagemSite.textContent = 'Erro ao salvar: ' + error.message;
      return;
    }

    mensagemSite.textContent = 'Site cadastrado!';
    document.getElementById('nomeSite').value = '';
    document.getElementById('slugSite').value = '';
    formularioSite.style.display = 'none';
    await carregarSites();
  } catch (error) {
    mensagemSite.textContent = 'Erro inesperado: ' + error.message;
  } finally {
    botao.disabled = false;
  }
};

carregarSites();
    } catch (error) {
          status.textContent = 'Não foi possível entrar: ' + error.message;
        } finally {
          button.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
