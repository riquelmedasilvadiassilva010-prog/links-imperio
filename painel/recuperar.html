
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha | Império Digital</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background: #101114;
      color: white;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 25px;
      box-sizing: border-box;
      background: #1b1c21;
      border-radius: 16px;
    }
    h1 { color: #e8b84a; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      background: #101114;
      border: 1px solid #444650;
      color: white;
    }
    button {
      background: #e8b84a;
      border: 0;
      font-weight: bold;
    }
    p { line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Nova senha</h1>
    <p>Digite e confirme sua nova senha.</p>

    <form id="form">
      <input id="senha" type="password"
        placeholder="Nova senha" minlength="8" required>
      <input id="confirmar" type="password"
        placeholder="Confirme a nova senha" minlength="8" required>
      <button id="botao" type="submit">Salvar nova senha</button>
    </form>

    <p id="status" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://hqoqbjwjjmnhctjizvcs.supabase.co',
      'sb_publishable_QK2T4-OP6omrbgGmTwbmsw_VKfgeFuk'
    );

    const status = document.getElementById('status');
    const form = document.getElementById('form');
    const botao = document.getElementById('botao');

    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session) {
      status.textContent =
        'Abra esta página pelo link mais recente de recuperação enviado ao seu e-mail.';
      form.hidden = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const senha = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmar').value;

      if (senha !== confirmar) {
        status.textContent = 'As senhas não são iguais.';
        return;
      }

      botao.disabled = true;
      status.textContent = 'Salvando nova senha...';

      const { error } = await supabase.auth.updateUser({
        password: senha
      });

      if (error) {
        status.textContent = 'Erro: ' + error.message;
      } else {
        status.textContent =
          'Senha alterada! Volte ao painel e entre com a nova senha.';
        form.hidden = true;
      }

      botao.disabled = false;
    });
  </script>
</body>
</html>
